<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Acceso — Sistema</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  /* ── RESET ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #07070f;
    --card:    #0f0f1e;
    --border:  #1e1e3a;
    --accent:  #00d4aa;
    --purple:  #7c3aed;
    --text:    #e8e8f0;
    --muted:   #6b6b8a;
    --error:   #ff4d6d;
    --success: #00d4aa;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* ── FONDO ANIMADO ── */
  .bg-grid {
    position: fixed; inset: 0; z-index: 0;
    background-image:
      linear-gradient(rgba(0,212,170,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,170,.04) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: gridDrift 20s linear infinite;
  }
  @keyframes gridDrift { to { transform: translate(40px, 40px); } }

  .orb {
    position: fixed; border-radius: 50%; filter: blur(80px); z-index: 0; pointer-events: none;
  }
  .orb-1 { width:400px;height:400px;background:rgba(124,58,237,.18);top:-100px;right:-100px; animation: float1 8s ease-in-out infinite; }
  .orb-2 { width:300px;height:300px;background:rgba(0,212,170,.12);bottom:-80px;left:-80px;  animation: float2 10s ease-in-out infinite; }
  @keyframes float1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-30px,30px)} }
  @keyframes float2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(20px,-20px)} }

  /* ── CARD ── */
  .card {
    position: relative; z-index: 1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 48px 44px;
    width: 100%; max-width: 420px;
    box-shadow: 0 0 0 1px rgba(0,212,170,.08), 0 40px 80px rgba(0,0,0,.5);
    animation: cardIn .6s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes cardIn { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:none} }

  .logo {
    display: flex; align-items: center; gap: 10px; margin-bottom: 36px;
  }
  .logo-dot {
    width: 32px; height: 32px; border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), var(--purple));
    box-shadow: 0 0 20px rgba(0,212,170,.4);
  }
  .logo-text { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 18px; letter-spacing: 1px; }

  h2 { font-family:'Syne',sans-serif; font-size: 26px; font-weight: 700; margin-bottom: 6px; }
  .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 32px; }

  /* ── STEPS ── */
  .step { display: none; }
  .step.active { display: block; animation: fadeIn .3s ease; }
  @keyframes fadeIn { from{opacity:0;transform:translateX(8px)} to{opacity:1;transform:none} }

  /* ── FORM ── */
  .field { margin-bottom: 20px; }
  label { display: block; font-size: 12px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 8px; }

  input[type=email], input[type=text] {
    width: 100%; padding: 14px 16px;
    background: rgba(255,255,255,.04);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0,212,170,.12);
  }

  /* OTP inputs */
  .otp-row { display: flex; gap: 10px; justify-content: center; margin: 8px 0; }
  .otp-digit {
    width: 52px; height: 58px;
    background: rgba(255,255,255,.04);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-size: 22px; font-weight: 700;
    text-align: center;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
    caret-color: var(--accent);
  }
  .otp-digit:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0,212,170,.15);
  }

  /* ── BOTÓN ── */
  .btn {
    width: 100%; padding: 15px;
    background: linear-gradient(135deg, var(--accent), var(--purple));
    border: none; border-radius: 12px;
    color: #fff; font-family:'Syne',sans-serif;
    font-size: 15px; font-weight: 700;
    letter-spacing: .5px;
    cursor: pointer;
    transition: opacity .2s, transform .15s, box-shadow .2s;
    box-shadow: 0 4px 20px rgba(0,212,170,.25);
    margin-top: 8px;
  }
  .btn:hover  { opacity: .92; transform: translateY(-1px); box-shadow: 0 8px 28px rgba(0,212,170,.3); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

  .btn-ghost {
    width: 100%; padding: 12px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--muted);
    font-size: 13px; cursor: pointer;
    margin-top: 10px;
    transition: border-color .2s, color .2s;
  }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

  /* ── MESSAGES ── */
  .msg {
    padding: 12px 16px; border-radius: 10px;
    font-size: 13px; margin-bottom: 16px;
    display: none;
  }
  .msg.show { display: block; animation: fadeIn .3s ease; }
  .msg.error   { background:rgba(255,77,109,.1); border:1px solid rgba(255,77,109,.3); color:#ff8fa0; }
  .msg.success { background:rgba(0,212,170,.08); border:1px solid rgba(0,212,170,.25); color:var(--accent); }

  /* ── TIMER ── */
  .timer { text-align: center; font-size: 12px; color: var(--muted); margin-top: 12px; }
  .timer span { color: var(--accent); font-weight: 600; }

  /* ── ADMIN LINK ── */
  .admin-link { text-align: center; margin-top: 28px; }
  .admin-link a { color: var(--muted); font-size: 12px; text-decoration: none; transition: color .2s; }
  .admin-link a:hover { color: var(--accent); }

  /* ── POPUP ── */
  .overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,.7); backdrop-filter: blur(8px);
    display: none; align-items: center; justify-content: center;
  }
  .overlay.show { display: flex; animation: fadeIn .3s ease; }

  .popup {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 40px 36px;
    max-width: 420px; width: 90%;
    box-shadow: 0 40px 80px rgba(0,0,0,.6);
    text-align: center;
    animation: cardIn .4s cubic-bezier(.16,1,.3,1) both;
  }
  .popup-icon {
    width: 64px; height: 64px;
    background: linear-gradient(135deg, var(--accent), var(--purple));
    border-radius: 20px; margin: 0 auto 20px;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    box-shadow: 0 0 30px rgba(0,212,170,.35);
  }
  .popup h3 { font-family:'Syne',sans-serif; font-size:22px; margin-bottom:8px; }
  .popup p  { color: var(--muted); font-size: 14px; margin-bottom: 24px; }

  .popup input[type=url] {
    width: 100%; padding: 13px 16px;
    background: rgba(255,255,255,.04);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-size: 14px; outline: none;
    transition: border-color .2s;
    margin-bottom: 16px;
  }
  .popup input[type=url]:focus { border-color: var(--accent); }

  /* spinner */
  .spinner {
    display: inline-block; width:16px; height:16px;
    border: 2px solid rgba(255,255,255,.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    vertical-align: middle; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<!-- ── CARD LOGIN ── -->
<div class="card">
  <div class="logo">
    <div class="logo-dot"></div>
    <span class="logo-text">MI SISTEMA</span>
  </div>

  <!-- Step 1: Email -->
  <div class="step active" id="step1">
    <h2>Iniciar sesión</h2>
    <p class="subtitle">Ingresa tu correo para recibir un código de acceso</p>

    <div id="msg1" class="msg"></div>

    <div class="field">
      <label>Correo electrónico</label>
      <input type="email" id="emailInput" placeholder="usuario@correo.com" autocomplete="email"/>
    </div>

    <button class="btn" id="btnSend" onclick="sendOTP()">Enviar código</button>
    <div class="admin-link"><a href="admin.html">Acceso administrador →</a></div>
  </div>

  <!-- Step 2: OTP -->
  <div class="step" id="step2">
    <h2>Código de acceso</h2>
    <p class="subtitle" id="subtitleOTP">Ingresa el código enviado a tu correo</p>

    <div id="msg2" class="msg"></div>

    <div class="otp-row">
      <input class="otp-digit" maxlength="1" inputmode="numeric" id="d0"/>
      <input class="otp-digit" maxlength="1" inputmode="numeric" id="d1"/>
      <input class="otp-digit" maxlength="1" inputmode="numeric" id="d2"/>
      <input class="otp-digit" maxlength="1" inputmode="numeric" id="d3"/>
      <input class="otp-digit" maxlength="1" inputmode="numeric" id="d4"/>
      <input class="otp-digit" maxlength="1" inputmode="numeric" id="d5"/>
    </div>

    <div class="timer">Expira en <span id="timerTxt">10:00</span></div>

    <button class="btn" id="btnVerify" onclick="verifyOTP()" style="margin-top:20px">Verificar código</button>
    <button class="btn-ghost" onclick="goBack()">← Cambiar correo</button>
  </div>
</div>

<!-- ── POPUP LINK ── -->
<div class="overlay" id="popup">
  <div class="popup">
    <div class="popup-icon">🔗</div>
    <h3>¡Acceso concedido!</h3>
    <p id="popupWelcome">Bienvenido. Ingresa el enlace de la aplicación a la que deseas acceder.</p>
    <input type="url" id="linkInput" placeholder="https://mi-app.com"/>
    <button class="btn" onclick="goToLink()">Abrir aplicación</button>
  </div>
</div>

<script>
// ── CONFIG ──────────────────────────────────────────────────
const API = "https://script.google.com/macros/s/AKfycbynMjkWu4Kv5dcKj1EslFuzjSYyejxohjiRFQn3glfWeHcaCUPqjfGAmnqTXKReheQ/exec"; // ← pega tu URL de Apps Script Web App

let currentEmail = "";
let timerInterval = null;
let sessionData = null;

// ── OTP DIGITS ──────────────────────────────────────────────
document.querySelectorAll('.otp-digit').forEach((inp, i) => {
  inp.addEventListener('input', e => {
    e.target.value = e.target.value.replace(/\D/g,'');
    if (e.target.value && i < 5) document.getElementById('d' + (i+1)).focus();
  });
  inp.addEventListener('keydown', e => {
    if (e.key === 'Backspace' && !e.target.value && i > 0)
      document.getElementById('d' + (i-1)).focus();
    if (e.key === 'Enter') verifyOTP();
  });
  inp.addEventListener('paste', e => {
    e.preventDefault();
    const paste = e.clipboardData.getData('text').replace(/\D/g,'').slice(0,6);
    paste.split('').forEach((ch, j) => {
      const el = document.getElementById('d' + j);
      if (el) el.value = ch;
    });
    document.getElementById('d' + (paste.length - 1)).focus();
  });
});

// ── SEND OTP ─────────────────────────────────────────────────
async function sendOTP() {
  const email = document.getElementById('emailInput').value.trim();
  if (!email) return showMsg('msg1', 'Ingresa tu correo electrónico', 'error');

  const btn = document.getElementById('btnSend');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Enviando...';

  try {
    const res = await post({ action:'sendOTP', email });
    if (res.ok) {
      currentEmail = email;
      document.getElementById('subtitleOTP').textContent = `Código enviado a ${email}`;
      document.getElementById('step1').classList.remove('active');
      document.getElementById('step2').classList.add('active');
      document.getElementById('d0').focus();
      startTimer(10 * 60);
    } else {
      showMsg('msg1', res.msg, 'error');
    }
  } catch(e) {
    showMsg('msg1', 'Error de conexión. Verifica la URL del API.', 'error');
  }

  btn.disabled = false;
  btn.innerHTML = 'Enviar código';
}

// ── VERIFY OTP ───────────────────────────────────────────────
async function verifyOTP() {
  const otp = [0,1,2,3,4,5].map(i => document.getElementById('d'+i).value).join('');
  if (otp.length < 6) return showMsg('msg2', 'Ingresa los 6 dígitos del código', 'error');

  const btn = document.getElementById('btnVerify');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Verificando...';

  try {
    const res = await post({ action:'verifyOTP', email: currentEmail, otp });
    if (res.ok) {
      clearInterval(timerInterval);
      sessionData = res;
      localStorage.setItem('session', JSON.stringify(res));
      document.getElementById('popupWelcome').textContent =
        `Bienvenido, ${res.nombre}. Ingresa el enlace de la aplicación.`;
      document.getElementById('popup').classList.add('show');
    } else {
      showMsg('msg2', res.msg, 'error');
      [0,1,2,3,4,5].forEach(i => document.getElementById('d'+i).value='');
      document.getElementById('d0').focus();
    }
  } catch(e) {
    showMsg('msg2', 'Error de conexión.', 'error');
  }

  btn.disabled = false;
  btn.innerHTML = 'Verificar código';
}

// ── GO TO LINK ───────────────────────────────────────────────
function goToLink() {
  const link = document.getElementById('linkInput').value.trim();
  if (!link) return;
  window.open(link, '_blank');
}

// ── HELPERS ──────────────────────────────────────────────────
function goBack() {
  clearInterval(timerInterval);
  document.getElementById('step2').classList.remove('active');
  document.getElementById('step1').classList.add('active');
  [0,1,2,3,4,5].forEach(i => document.getElementById('d'+i).value='');
}

function showMsg(id, text, type) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = `msg ${type} show`;
}

function startTimer(seconds) {
  clearInterval(timerInterval);
  let remaining = seconds;
  const el = document.getElementById('timerTxt');
  timerInterval = setInterval(() => {
    remaining--;
    const m = Math.floor(remaining / 60).toString().padStart(2,'0');
    const s = (remaining % 60).toString().padStart(2,'0');
    el.textContent = `${m}:${s}`;
    if (remaining <= 0) {
      clearInterval(timerInterval);
      el.textContent = 'expirado';
      showMsg('msg2', 'El código expiró. Solicita uno nuevo.', 'error');
    }
  }, 1000);
}

async function post(data) {
  const r = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  });
  return r.json();
}

// Enter en email
document.getElementById('emailInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') sendOTP();
});
</script>
</body>
</html>
